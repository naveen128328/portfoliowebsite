
name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::768649629800:role/PortfolioSSMDeployPermission
          aws-region: ap-south-1

      - name: Send Deployment Command
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-03a00fce56937b1c8" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["/home/ubuntu/deploy.sh"]}' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for Deployment
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-03a00fce56937b1c8" \
              --region ap-south-1 \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-03a00fce56937b1c8" \
                --region ap-south-1 \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-03a00fce56937b1c8" \
                --region ap-south-1 \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
